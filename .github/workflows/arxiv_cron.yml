name: AI Breakthrough Wire Cron

on:
  schedule:
    # Runs every 6 hours at minute 18 (off-peak, avoids queue congestion)
    - cron: '18 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Ingest and Filter ArXiv Papers
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          python3 ingest_arxiv.py

      - name: Commit and push updates
        run: |
          git config user.name "arxiv-wire-bot[bot]"
          git config user.email "arxiv-wire-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No new breakthroughs detected. Skipping commit."
          else
            git commit -m "chore(arxiv): publish daily AI breakthrough radar [skip ci]"
            git push origin main
          fi
